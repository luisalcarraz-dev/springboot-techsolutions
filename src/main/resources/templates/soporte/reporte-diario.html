<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reporte Diario de Incidencias</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
        }

        header {
            background-color: #020617;
            color: white;
            padding: 18px 30px;
            font-size: 20px;
        }
        header .logout {
            color: #ffcc00;
            text-decoration: none;
            margin-left: 15px;
        }
        header .logout:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        th {
            background-color: #020617;
            color: white;
        }

        footer {
            text-align: center;
            font-size: 13px;
            color: #6b7280;
            margin-top: 30px;
        }
        .date-selector {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .date-selector label {
            font-weight: bold;
        }
        .date-selector input[type="date"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .date-selector button {
            padding: 8px 15px;
            background-color: #020617;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .date-selector button:hover {
            background-color: #1a202c;
        }
    </style>
</head>
<body>

<header>
    Reporte Diario de Incidencias – Jefe de Soporte
    <div style="float: right; margin-right: 20px;">
        <span th:text="${session.usuario.nombres + ' ' + session.usuario.apellidos}">Nombre Jefe</span>
        <a th:href="@{/logout}" class="logout" style="margin-left: 15px;">Cerrar Sesión</a>
    </div>
</header>

<div class="container">

    <div class="date-selector">
        <form th:action="@{/soporte/reporte-diario}" method="get">
            <label for="fecha">Seleccionar Fecha:</label>
            <input type="date" id="fecha" name="fecha" th:value="${fechaReporte}">
            <button type="submit">Ver Reporte</button>
        </form>
    </div>

    <div class="card">
        <h2 th:text="'Resumen Diario (' + ${#temporals.format(fechaReporte, 'dd/MM/yyyy')} + ')'">Resumen Diario (07/02/2026)</h2>
        <canvas id="incidenciasEstado"></canvas>
    </div>

    <div class="card">
        <h2>Detalle de Incidencias</h2>
        <table>
            <thead>
                <tr>
                    <th>N° Ticket</th>
                    <th>Cliente</th>
                    <th>Prioridad</th>
                    <th>Estado</th>
                    <th>Técnico</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="incidencia : ${detalleIncidencias}">
                    <td th:text="${incidencia.codigoTicket}">TCK-00160</td>
                    <td th:text="${incidencia.cliente.nombres + ' ' + incidencia.cliente.apellidos}">Ana Torres</td>
                    <td th:text="${incidencia.clasificacion != null ? incidencia.clasificacion.prioridad.nombre : 'N/A'}">Alta</td>
                    <td th:text="${incidencia.estado.nombre}">Atrasado</td>
                    <td th:text="${incidencia.asignacion != null ? (incidencia.asignacion.tecnico.nombres + ' ' + incidencia.asignacion.tecnico.apellidos) : 'Sin Asignar'}">María Torres</td>
                </tr>
                <tr th:if="${detalleIncidencias.empty}">
                    <td colspan="5">No hay incidencias registradas para esta fecha.</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>

<footer>
    © 2026 TechSolutions Perú S.A.C.
</footer>

<script th:inline="javascript">
/*<![CDATA[*/
const ctx = document.getElementById('incidenciasEstado');

const chartLabels = /*[[${chartLabels}]]*/ ['Abiertos', 'En Proceso', 'Cerrados', 'Atrasados'];
const chartData = /*[[${chartData}]]*/ [3, 4, 2, 5];

new Chart(ctx, {
    type: 'bar',
    data: {
        labels: chartLabels,
        datasets: [{
            label: 'Cantidad de Incidencias',
            data: chartData,
            backgroundColor: [
                'rgba(255, 99, 132, 0.6)', // Abiertos (rojo)
                'rgba(54, 162, 235, 0.6)', // En Proceso (azul)
                'rgba(75, 192, 192, 0.6)', // Cerrados (verde)
                'rgba(255, 206, 86, 0.6)'  // Atrasados (amarillo)
            ],
            borderColor: [
                'rgba(255, 99, 132, 1)',
                'rgba(54, 162, 235, 1)',
                'rgba(75, 192, 192, 1)',
                'rgba(255, 206, 86, 1)'
            ],
            borderWidth: 1
        }]
    },
    options: {
        responsive: true,
        scales: {
            y: {
                beginAtZero: true,
                ticks: {
                    precision: 0 // Asegura que los ticks del eje Y sean enteros
                }
            }
        }
    }
});
/*]]>*/
</script>

</body>
</html>
