<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Orden de Trabajo | Técnico</title>
    <!-- Aquí puedes incluir tus CSS si los tienes -->
	<style>
	    /* ------------------------------------- */
	    /*           Base & Reset                */
	    /* ------------------------------------- */
	    * {
	        box-sizing: border-box;
	        font-family: 'Segoe UI', 'Roboto', 'Arial', sans-serif; /* Fuente más moderna */
	    }

	    body {
	        margin: 0;
	        background-color: #f1f5f9; /* Fondo gris claro */
	        color: #374151; /* Color de texto base */
	        line-height: 1.6;
	    }

	    /* ------------------------------------- */
	    /*           Layout General              */
	    /* ------------------------------------- */
	    .container {
	        max-width: 1200px; /* Un poco más ancho para pantallas grandes */
	        margin: 30px auto;
	        background-color: #ffffff; /* Fondo blanco para el contenido principal */
	        padding: 30px; /* Más padding */
	        border-radius: 10px; /* Bordes más suaves */
	        box-shadow: 0 8px 20px rgba(0,0,0,0.1); /* Sombra más pronunciada pero suave */
	    }

	    /* ------------------------------------- */
	    /*           Cabecera y Pie de Página    */
	    /* ------------------------------------- */
	    header {
	        background-color: #020617; /* Azul oscuro casi negro */
	        color: #ffffff;
	        padding: 18px 30px; /* Ajustado para consistencia */
	        font-size: 22px; /* Un poco más grande */
	        font-weight: 600; /* Más peso */
	        display: flex; /* Para alinear el contenido de la cabecera */
	        justify-content: space-between; /* Espacio entre título y usuario/logout */
	        align-items: center;
	    }

	    header .logout {
	        color: #ffcc00; /* Amarillo/naranja para el enlace de cerrar sesión */
	        text-decoration: none;
	        font-size: 16px;
	        font-weight: normal;
	        margin-left: 20px;
	    }

	    header .logout:hover {
	        text-decoration: underline;
	        color: #ffd700; /* Un poco más brillante al pasar el ratón */
	    }

	    footer {
	        margin-top: 40px; /* Más espacio en el pie de página */
	        text-align: center;
	        font-size: 14px;
	        color: #6b7280; /* Gris sutil */
	        padding: 15px 0; /* Padding para el pie de página */
	    }

	    /* ------------------------------------- */
	    /*           Títulos y Encabezados       */
	    /* ------------------------------------- */
	    h2 {
	        margin-top: 0;
	        color: #020617;
	        border-bottom: 2px solid #e5e7eb; /* Separador sutil */
	        padding-bottom: 12px; /* Más espacio debajo */
	        font-size: 24px;
	        font-weight: 600;
	        margin-bottom: 30px;
	    }

	    h3 {
	        margin-top: 35px; /* Más espacio arriba */
	        margin-bottom: 20px; /* Espacio debajo */
	        color: #1e293b; /* Un gris oscuro */
	        font-size: 20px;
	        font-weight: 500;
	    }

	    /* ------------------------------------- */
	    /*           Info Grid (Datos Generales) */
	    /* ------------------------------------- */
	    .info-grid {
	        display: grid;
	        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); /* Más flexible */
	        gap: 20px; /* Más separación */
	        margin-bottom: 30px;
	    }

	    .info-box {
	        background-color: #f8fafc; /* Fondo muy claro */
	        padding: 15px 20px; /* Más padding */
	        border-left: 6px solid #2563eb; /* Borde azul vibrante */
	        border-radius: 8px; /* Bordes más redondeados */
	        font-size: 15px;
	        display: flex; /* Para alinear el label y el valor */
	        flex-direction: column; /* Apilar label y valor */
	        justify-content: center;
	        min-height: 70px; /* Altura mínima para uniformidad */
	    }

	    .info-box span:first-child { /* Estilo para el label (primer span) */
	        display: block;
	        font-weight: bold;
	        color: #4b5563; /* Gris más oscuro para el label */
	        font-size: 13px;
	        margin-bottom: 4px;
	        text-transform: uppercase; /* Mayúsculas para el label */
	    }

	    .info-box span:last-child { /* Estilo para el valor (segundo span) */
	        color: #1e293b;
	        font-weight: 500;
	    }

	    /* ------------------------------------- */
	    /*           Estados y Prioridades       */
	    /* ------------------------------------- */
	    .status {
	        display: inline-block;
	        padding: 6px 14px;
	        border-radius: 15px; /* Más redondeado (pastilla) */
	        font-size: 13px;
	        font-weight: bold;
	        color: white;
	        background-color: #2563eb; /* Azul por defecto */
	        text-transform: uppercase;
	        letter-spacing: 0.5px;
	    }

	    .status-late { /* Estilo específico para estados 'Atrasado' */
	        background-color: #ef4444; /* Rojo */
	    }
	    .status-en-proceso { /* Ejemplo para 'En Proceso' */
	        background-color: #f97316; /* Naranja */
	    }
	    .status-cerrado { /* Ejemplo para 'Cerrado' */
	        background-color: #22c55e; /* Verde */
	    }
	    .status-pendiente-conformidad { /* Nuevo estado */
	        background-color: #8b5cf6; /* Púrpura */
	    }


	    .priority-alta {
	        color: #ef4444; /* Rojo */
	        font-weight: bold;
	    }
	    .priority-media {
	        color: #f97316; /* Naranja */
	        font-weight: bold;
	    }
	    .priority-baja {
	        color: #22c55e; /* Verde */
	        font-weight: bold;
	    }
	    .priority-critica { /* Si añades esta prioridad */
	        color: #be123c; /* Rojo oscuro */
	        font-weight: bold;
	    }


	    /* ------------------------------------- */
	    /*           Bloques de Descripción      */
	    /* ------------------------------------- */
	    .block {
	        background-color: #fefce8; /* Amarillo muy claro */
	        border-left: 6px solid #eab308; /* Borde amarillo */
	        padding: 18px; /* Más padding */
	        border-radius: 8px; /* Bordes redondeados */
	        font-size: 15px;
	        color: #713f12; /* Texto marrón oscuro */
	        margin-bottom: 30px;
	    }

	    .block strong {
	        display: block;
	        margin-bottom: 10px;
	        color: #854d0e; /* Marrón más oscuro para los títulos */
	        font-size: 16px;
	    }
	    .block.client { /* Si quieres un estilo diferente para descripciones del cliente */
	        background-color: #e0f2f7; /* Azul claro */
	        border-left-color: #0ea5e9; /* Azul */
	        color: #075985;
	    }

	    /* ------------------------------------- */
	    /*           Formularios                 */
	    /* ------------------------------------- */
	    .form-group {
	        margin-bottom: 20px; /* Más espacio entre grupos de formulario */
	    }

	    label {
	        display: block;
	        font-weight: 600; /* Más peso */
	        margin-bottom: 8px;
	        color: #374151;
	        font-size: 15px;
	    }

	    textarea, select, input[type="text"], input[type="number"], input[type="date"] {
	        width: 100%;
	        padding: 12px; /* Más padding en inputs */
	        border: 1px solid #cbd5e1; /* Borde más suave */
	        border-radius: 8px; /* Bordes más redondeados */
	        font-size: 15px;
	        color: #1e293b;
	        transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
	    }

	    textarea:focus, select:focus, input[type="text"]:focus, input[type="number"]:focus, input[type="date"]:focus {
	        border-color: #2563eb; /* Borde azul al enfocar */
	        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); /* Sombra suave al enfocar */
	        outline: none; /* Eliminar el contorno por defecto del navegador */
	    }

	    textarea {
	        min-height: 120px; /* Altura mínima un poco mayor */
	        resize: vertical;
	    }

	    /* Estilo para los botones */
	    .actions {
	        margin-top: 40px; /* Más espacio arriba de los botones */
	        text-align: right; /* Alinear a la derecha */
	        display: flex; /* Para alinear botones */
	        justify-content: flex-end; /* Alinear a la derecha */
	        gap: 10px; /* Espacio entre botones */
	    }

	    .btn {
	        border: none;
	        padding: 12px 25px; /* Más padding en botones */
	        font-size: 15px; /* Fuente un poco más grande */
	        font-weight: 600;
	        border-radius: 8px; /* Bordes más redondeados */
	        cursor: pointer;
	        transition: background-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
	        text-decoration: none; /* Para los 'a' que actúan como botones */
	        display: inline-flex; /* Para centrar texto si es necesario */
	        align-items: center;
	        justify-content: center;
	    }

	    .btn-save {
	        background-color: #0f766e; /* Verde azulado */
	        color: white;
	    }

	    .btn-save:hover {
	        background-color: #115e59; /* Verde azulado más oscuro */
	        box-shadow: 0 4px 10px rgba(15, 118, 110, 0.2);
	    }

	    .btn-close { /* Ahora para Solicitar Cierre (rojo) */
	        background-color: #dc2626; /* Rojo */
	        color: white;
	    }

	    .btn-close:hover {
	        background-color: #b91c1c; /* Rojo más oscuro */
	        box-shadow: 0 4px 10px rgba(220, 38, 38, 0.2);
	    }

	    .btn-cancel { /* Botón de Cancelar/Volver */
	        background-color: #6b7280; /* Gris */
	        color: white;
	    }
	    .btn-cancel:hover {
	        background-color: #4b5563; /* Gris más oscuro */
	        box-shadow: 0 4px 10px rgba(107, 114, 128, 0.2);
	    }

	    /* Si tienes más botones como btn-primary, btn-secondary, etc. */
	    .btn-primary {
	        background-color: #2563eb; /* Azul */
	        color: white;
	    }
	    .btn-primary:hover {
	        background-color: #1d4ed8; /* Azul más oscuro */
	        box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
	    }

	    /* Alertas de mensajes (si usas flash attributes con Thymeleaf) */
	    .alert {
	        padding: 15px 20px;
	        margin-bottom: 25px;
	        border-radius: 8px;
	        font-size: 15px;
	        font-weight: 500;
	        display: flex;
	        align-items: center;
	        gap: 10px;
	    }

	    .alert-success {
	        background-color: #d1fae5; /* Verde claro */
	        color: #065f46; /* Verde oscuro */
	        border: 1px solid #34d399;
	    }

	    .alert-error {
	        background-color: #fee2e2; /* Rojo claro */
	        color: #991b1b; /* Rojo oscuro */
	        border: 1px solid #f87171;
	    }

	    .alert-info {
	        background-color: #e0f2fe; /* Azul claro */
	        color: #0c4a6e; /* Azul oscuro */
	        border: 1px solid #60a5fa;
	    }
	</style>
</head>
<body>

<header>
    Panel del Técnico - Orden de Trabajo
    <div style="float: right; margin-right: 20px;">
        <span th:text="${session.usuario.nombres + ' ' + session.usuario.apellidos}">Nombre Técnico</span>
        <a th:href="@{/logout}" class="logout" style="margin-left: 15px;">Cerrar Sesión</a>
    </div>
</header>

<div class="container">
    <h2>Orden de Trabajo para Ticket <span th:text="${ticket.codigoTicket}">TCK-XXXX</span></h2>

    <!-- Información del Ticket (puedes añadir más detalles aquí si lo necesitas) -->
    <div class="info-grid">
        <div class="info-box">
            <span>N° Ticket</span>
            <span th:text="${ticket.codigoTicket}">TCK-000160</span>
        </div>
        <div class="info-box">
            <span>Estado</span>
            <span th:text="${ticket.estado.nombre}">EN_PROCESO</span>
        </div>
        <div class="info-box">
            <span>Solicitante</span>
            <span th:text="${ticket.cliente.nombres + ' ' + ticket.cliente.apellidos}">Ana Torres</span>
        </div>
    </div>

    <!-- Formulario de Orden de Trabajo para GUARDAR AVANCE -->
    <h3>Detalle de la Orden de Trabajo</h3>
    <form th:action="@{/tecnico/ticket/{idIncidencia}/guardar-avance(idIncidencia=${ticket.idIncidencia})}" method="post" th:object="${ordenTrabajo}">
        <!-- Campo oculto para el ID de la orden de trabajo si ya existe -->
        <input type="hidden" th:field="*{idOrden}" />

        <div class="form-group">
            <label for="actividades">Actividades Realizadas</label>
            <textarea id="actividades" th:field="*{actividades}" placeholder="Detalle las actividades realizadas durante la atención..." required></textarea>
        </div>

        <div class="form-group">
            <label for="herramientas">Herramientas/Recursos Utilizados</label>
            <textarea id="herramientas" th:field="*{herramientas}" placeholder="Indique las herramientas, software o recursos utilizados..."></textarea>
        </div>

        <div class="form-group">
            <label for="observaciones">Observaciones/Diagnóstico</label>
            <textarea id="observaciones" th:field="*{observaciones}" placeholder="Describa el diagnóstico, observaciones adicionales o próximos pasos..."></textarea>
        </div>
		<input type="hidden" name="nuevoEstadoId" th:value="${ticket.estado.idEstado}">

        <div class="actions">
            <button type="submit" class="btn btn-save">Guardar Avance</button>
            <a th:href="@{/tecnico/home}" class="btn btn-cancel">Volver</a>
        </div>
    </form>

    <!-- Formulario SEPARADO para SOLICITAR CIERRE -->
    <div class="actions" style="margin-top: 20px;">
        <form th:action="@{/tecnico/ticket/{idIncidencia}/solicitar-cierre(idIncidencia=${ticket.idIncidencia})}" method="post">
            <button type="submit" class="btn btn-close">Solicitar Cierre al Cliente</button>
        </form>
    </div>

</div>

<footer>
    © 2026 TechSolutions Perú S.A.C. | Orden de Trabajo
</footer>

</body>
</html>
